<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLEXIN — Product</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet"><style>:root{--bg:#000;--line:#222;--muted:#999;--fg:#fff}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--fg);font-family:Cairo,Inter,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:0 22px}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.top img{height:28px;width:auto}.back{border:1px solid #333;padding:8px 15px;border-radius:3px;font-size:13px}.product{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;padding:70px 0}.visual{background:#fff;display:grid;place-items:center;min-height:520px}.visual img{width:86%;max-height:520px;object-fit:contain}.info{display:flex;flex-direction:column;justify-content:center;gap:18px}.kicker{font-size:12px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase}h1{font-family:Archivo Black,Cairo,sans-serif;font-size:clamp(34px,5vw,58px);line-height:1.05;direction:ltr;text-align:right}.price{font-size:27px;font-weight:800}.old{text-decoration:line-through;color:#777;font-size:16px;margin-inline-start:12px;font-weight:400}.desc{color:#bbb;font-size:15px;line-height:1.8}.label{font-size:13px;color:#aaa;margin-top:8px}.sizes{display:flex;gap:8px}.sizes button{width:54px;height:45px;background:#000;border:1px solid #444;color:#fff;border-radius:3px}.sizes button.on{background:#fff;color:#000;border-color:#fff}.add{margin-top:8px;background:#fff;color:#000;border:0;padding:15px;font-weight:800;font-size:15px;border-radius:3px;cursor:pointer}.note{color:#777;font-size:12px}.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,140%);opacity:0;visibility:hidden;pointer-events:none;background:#fff;color:#000;padding:12px 24px;border-radius:99px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 12px 34px rgba(0,0,0,.55);transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .4s ease,visibility 0s linear .55s;z-index:100}.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .35s ease,visibility 0s}@media(max-width:760px){.product{grid-template-columns:1fr;gap:30px;padding:35px 0}.visual{min-height:360px}.visual img{max-height:360px}.top{height:56px}.top img{height:24px}}</style></head><body><div class="wrap"><header class="top"><a href="index.html"><img src="flexin-logo.png" alt="FLEXIN"></a><a class="back" href="index.html#products">← الرجوع للمنتجات</a></header><main class="product" id="product"></main></div><div class="toast" id="toast"></div><script>function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),1800)}const products=[{id:"bat",name:"Bat T-shirt",price:220,oldPrice:300,img:"bat.png",desc:"تيشرت كومبريشن أسود بطباعة بات بيضاء.",cat:"T-SHIRT"},{id:"spider",name:"Spider T-shirt",price:220,oldPrice:300,img:"spider.png",desc:"تيشرت كومبريشن أسود بطباعة سبايدر بيضاء.",cat:"T-SHIRT"},{id:"black-sweatpants",name:"Black Sweatpants",price:480,oldPrice:550,img:"black-sweatpants.jpg",desc:"Black Sweatpants من FLEXIN.",cat:"PANTS"},{id:"gray-sweatpants",name:"Gray Sweatpants",price:480,oldPrice:550,img:"gray-sweatpants.jpg",desc:"Gray Sweatpants من FLEXIN.",cat:"PANTS",color:"Gray"}];products.forEach(x=>{if(!x.color)x.color="Black"});const id=new URLSearchParams(location.search).get("p"),p=products.find(x=>x.id===id)||products[0];document.title="FLEXIN — "+p.name;document.getElementById("product").innerHTML=`<section class="visual"><img src="${p.img}" alt="${p.name}"></section><section class="info"><div class="kicker">${p.cat}</div><h1>${p.name}</h1><div class="price">${p.price} ج.م <span class="old">${p.oldPrice} ج.م</span></div><p class="desc">${p.desc}</p><div class="label">المقاس</div><div class="sizes">${["S","M","L","XL"].map(s=>`<button data-s="${s}">${s}</button>`).join("")}</div><button class="add" id="add">أضف للسلة</button><div class="note">الدفع عند الاستلام · الشحن حسب المحافظة</div></section>`;let size="";document.querySelectorAll(".sizes button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".sizes button").forEach(x=>x.classList.remove("on"));b.classList.add("on");size=b.dataset.s});document.getElementById("add").onclick=()=>{if(!size){toast("اختار المقاس الأول");return}const cart=JSON.parse(localStorage.getItem("flexin_cart")||"[]"),found=cart.find(x=>x.id===p.id&&x.size===size&&x.color===p.color);if(found)found.qty++;else cart.push({id:p.id,size,color:p.color,qty:1});localStorage.setItem("flexin_cart",JSON.stringify(cart));location.href="index.html#products"};</script></body></html>
