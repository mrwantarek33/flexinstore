<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLEXIN — Built to be seen</title>
<meta name="description" content="FLEXIN — Premium compression gym tees. Built to be seen.">
<meta property="og:title" content="FLEXIN — Built to be seen">
<meta property="og:description" content="Premium compression gym tees.">
<meta property="og:image" content="bat.png">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='black'/><text x='32' y='46' font-size='40' font-family='Arial Black,Arial' font-weight='900' text-anchor='middle' fill='white'>F</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--s1:#0a0a0a;--s2:#111;--s3:#181818;
  --line:#1e1e1e;--line2:#2c2c2c;
  --g1:#3a3a3a;--g2:#6e6e6e;--g3:#a6a6a6;--fg:#fff;
  --ease:cubic-bezier(.2,.7,.2,1)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:'Inter','Cairo',sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang=ar] body{font-family:'Cairo','Inter',sans-serif}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;opacity:.045;mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{display:block;max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 22px}
.disp{font-family:'Archivo Black','Cairo',sans-serif;letter-spacing:-.01em;text-transform:uppercase}
html[lang=ar] .disp{font-family:'Cairo',sans-serif;font-weight:800;text-transform:none;letter-spacing:0}

/* top brand logo */
.top-brand{
  background:#000;
  border-bottom:1px solid var(--line);
  padding:22px 20px 18px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.top-brand img{height:38px;width:auto}
@media(max-width:760px){.top-brand img{height:30px}}

/* announcement */
.ann{background:#0c0c0c;border-bottom:1px solid var(--line);text-align:center;font-size:12px;letter-spacing:.14em;color:var(--g3);padding:8px 12px;text-transform:uppercase}
html[lang=ar] .ann{letter-spacing:.02em;text-transform:none;font-size:13px}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:66px;gap:12px}
.logo img{height:22px;width:auto}
.bar nav{display:flex;gap:26px;align-items:center;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--g3)}
html[lang=ar] .bar nav{letter-spacing:0;font-size:15px;text-transform:none}
.bar nav a{transition:.2s}.bar nav a:hover{color:var(--fg)}
.tools{display:flex;gap:10px;align-items:center}
.lang{background:transparent;color:var(--fg);border:1px solid var(--line2);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:600;letter-spacing:.08em;transition:.2s}
.lang:hover{border-color:var(--g2)}
.cartbtn{background:var(--fg);color:#000;border:0;border-radius:99px;padding:8px 18px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
.cartbtn b{display:grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:#000;color:#fff;font-size:11px}
@media(max-width:760px){.bar nav .lk{display:none}.logo img{height:18px}}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero .spot{position:absolute;inset:0;background:radial-gradient(ellipse 55% 60% at 70% 45%,#1b1b1b 0,transparent 70%);pointer-events:none}
html[dir=rtl] .hero .spot{background:radial-gradient(ellipse 55% 60% at 30% 45%,#1b1b1b 0,transparent 70%)}
.hero .grid2{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:center;min-height:calc(100vh - 106px);padding:40px 0}
@media(max-width:900px){.hero .grid2{grid-template-columns:1fr;min-height:0;padding:44px 0 20px}}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.24em;color:var(--g3);text-transform:uppercase;margin-bottom:22px}
.eyebrow::before{content:"";width:34px;height:1px;background:var(--g2)}
html[lang=ar] .eyebrow{letter-spacing:.06em;font-size:14px;text-transform:none}
h1{font-size:clamp(46px,8.4vw,116px);line-height:.95}
html[lang=ar] h1{line-height:1.12;font-size:clamp(46px,8vw,104px)}
h1 span{display:block}
h1 .dim{color:var(--g2)}
.hero p.lead{color:var(--g3);font-size:18px;max-width:470px;margin:26px 0 34px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--fg);color:#000;border:1px solid var(--fg);border-radius:4px;padding:15px 34px;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;transition:.25s var(--ease)}
html[lang=ar] .btn{letter-spacing:0;font-size:16px;text-transform:none}
.btn:hover{background:transparent;color:var(--fg)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--fg)}
.visual{position:relative;height:min(64vh,620px);min-height:340px}
.visual img{position:absolute;width:62%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.85));transition:.6s var(--ease)}
.visual .a{top:2%;inset-inline-start:2%;transform:rotate(-7deg);z-index:2}
.visual .b{top:12%;inset-inline-end:0;transform:rotate(6deg);z-index:1}
.visual:hover .a{transform:rotate(-9deg) translateY(-8px)}
.visual:hover .b{transform:rotate(8deg) translateY(-4px)}
@media(max-width:900px){.visual{height:340px}.visual img{width:58%}}

/* marquee */
.marq{overflow:hidden;border-bottom:1px solid var(--line);background:var(--s1);direction:ltr}
.marq .track{display:flex;width:max-content;animation:mq 32s linear infinite}
.marq span{font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.2em;color:var(--g2);padding:15px 26px;white-space:nowrap;text-transform:uppercase}
.marq span.d{color:var(--g1);padding:15px 0}
@keyframes mq{to{transform:translateX(-50%)}}

/* sections */
section{padding:92px 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:44px;flex-wrap:wrap}
.head h2{font-size:clamp(34px,5vw,60px);line-height:1}
html[lang=ar] .head h2{line-height:1.2}
.head .sub{color:var(--g2);font-size:14px;letter-spacing:.14em;text-transform:uppercase}
html[lang=ar] .head .sub{letter-spacing:0;font-size:15px;text-transform:none}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2px;background:var(--line);border:1px solid var(--line)}
.card{background:var(--bg);display:flex;flex-direction:column;position:relative}
.pic{aspect-ratio:1/1.05;background:radial-gradient(ellipse 60% 55% at 50% 42%,#222 0,#0c0c0c 70%,#050505 100%);display:grid;place-items:center;overflow:hidden;position:relative}
.pic img{width:84%;transition:transform .7s var(--ease);filter:drop-shadow(0 24px 30px rgba(0,0,0,.8))}
.card:hover .pic img{transform:scale(1.06) translateY(-6px)}
.badge{position:absolute;top:16px;inset-inline-start:16px;background:var(--fg);color:#000;font-size:11px;font-weight:700;letter-spacing:.1em;padding:5px 10px;border-radius:2px}
.num{position:absolute;top:14px;inset-inline-end:18px;font-family:'Archivo Black',sans-serif;color:var(--g1);font-size:14px;letter-spacing:.1em}
.body{padding:24px 24px 28px;display:flex;flex-direction:column;gap:14px;flex:1;border-top:1px solid var(--line)}
.body h3{font-size:24px;direction:ltr;text-align:start;line-height:1.1}
.price{display:flex;align-items:baseline;gap:12px;font-size:22px;font-weight:700}
.price .old{font-size:15px;font-weight:400;color:var(--g2);text-decoration:line-through;text-decoration-color:var(--g2)}
.desc{color:var(--g3);font-size:14px}
.lbl{font-size:11px;letter-spacing:.2em;color:var(--g2);text-transform:uppercase}
html[lang=ar] .lbl{letter-spacing:0;font-size:13px;text-transform:none}
.sizes{display:flex;gap:8px}
.sizes button{flex:1;max-width:64px;height:44px;background:transparent;color:var(--g3);border:1px solid var(--line2);border-radius:3px;font-weight:600;font-size:14px;transition:.2s}
.sizes button:hover{border-color:var(--g3);color:var(--fg)}
.sizes button.on{background:var(--fg);border-color:var(--fg);color:#000}
.card .btn{width:100%;margin-top:auto}

/* features */
.feat{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.feat>div{padding:38px 28px;display:flex;gap:18px;align-items:flex-start;border-inline-end:1px solid var(--line)}
.feat>div:last-child{border-inline-end:0}
.feat svg{flex:none;width:34px;height:34px;stroke:var(--g3);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.feat b{display:block;font-size:16px;margin-bottom:2px}
.feat span{color:var(--g2);font-size:14px}
@media(max-width:760px){.feat{grid-template-columns:1fr}.feat>div{border-inline-end:0;border-bottom:1px solid var(--line)}.feat>div:last-child{border-bottom:0}}

/* about */
.about{background:linear-gradient(180deg,var(--s1),var(--bg));position:relative;overflow:hidden}
.about .ghost{position:absolute;inset-inline:0;bottom:-30px;opacity:.035;pointer-events:none}
.about .ghost img{width:90%;margin:0 auto}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:64px;position:relative}
@media(max-width:860px){.two{grid-template-columns:1fr;gap:44px}}
.quote{font-size:clamp(28px,3.8vw,46px);line-height:1.12;margin-bottom:30px}
html[lang=ar] .quote{line-height:1.3}
.quote em{font-style:normal;color:var(--g2)}
.about p{color:var(--g3);margin-bottom:16px;max-width:620px}
.sig{margin-top:26px;font-size:12px;letter-spacing:.3em;color:var(--g2);text-transform:uppercase}
html[lang=ar] .sig{letter-spacing:.04em;font-size:14px;text-transform:none}
.sg h3{font-size:22px;margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:15px;text-align:center}
th,td{border-bottom:1px solid var(--line2);padding:15px 8px}
th{color:var(--g2);font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
html[lang=ar] th{letter-spacing:0;font-size:13px;text-transform:none}
td:first-child{font-family:'Archivo Black',sans-serif}

/* footer */
footer{border-top:1px solid var(--line);padding:56px 0 34px}
.fgrid{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-end}
footer .logo img{height:30px;margin-bottom:14px}
footer p{color:var(--g2);font-size:14px;max-width:340px}
.links{display:flex;gap:22px;flex-wrap:wrap}
.links a{color:var(--g3);font-size:14px;border-bottom:1px solid var(--line2);padding-bottom:2px;transition:.2s}
.links a:hover{color:var(--fg);border-color:var(--fg)}
.copy{margin-top:40px;padding-top:22px;border-top:1px solid var(--line);color:var(--g1);font-size:12px;letter-spacing:.14em;display:flex;justify-content:space-between}

/* whatsapp float */
.wa{position:fixed;bottom:20px;inset-inline-start:20px;z-index:35;width:52px;height:52px;border-radius:50%;background:var(--s3);border:1px solid var(--line2);display:grid;place-items:center;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.wa:hover{background:var(--fg)}
.wa svg{width:24px;height:24px;fill:var(--fg);transition:.25s}
.wa:hover svg{fill:#000}

/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s;z-index:60}
.ov.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(440px,100%);background:#070707;border-left:1px solid var(--line2);z-index:70;transform:translateX(105%);transition:.32s var(--ease);display:flex;flex-direction:column}
.drawer.show{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line);font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
html[lang=ar] .dh{letter-spacing:0;font-size:17px;text-transform:none}
.dh button{background:none;border:0;color:var(--fg);font-size:30px;line-height:1}
.items{flex:1;overflow:auto;padding:6px 22px}
.it{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.it img{width:64px;height:64px;object-fit:contain;background:radial-gradient(circle,#222,#080808);border-radius:4px;flex:none}
.it .meta{flex:1;font-size:14px}
.it .meta b{display:block;font-size:15px;direction:ltr;text-align:start}
.it .meta span{color:var(--g2)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:28px;height:28px;border-radius:3px;background:transparent;border:1px solid var(--line2);color:var(--fg)}
.empty{color:var(--g2);text-align:center;padding:60px 0}
.df{padding:20px 22px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;max-height:62vh;overflow:auto}
.row{display:flex;justify-content:space-between;font-size:14px;color:var(--g3)}
.row.t{font-weight:700;font-size:19px;color:var(--fg);padding-top:6px}
input,select,textarea{width:100%;background:#000;color:var(--fg);border:1px solid var(--line2);border-radius:3px;padding:13px;font-family:inherit;font-size:15px}
input::placeholder,textarea::placeholder{color:var(--g2)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g3)}
textarea{resize:none;height:66px}
.note{font-size:12px;color:var(--g2);text-align:center}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px 26px}
.done[hidden]{display:none}
.done .ok{width:64px;height:64px;border-radius:50%;border:1px solid var(--g2);display:grid;place-items:center;font-size:30px}
.done h3{font-size:24px}
.done .oid{font-family:'Archivo Black',sans-serif;letter-spacing:.14em;color:var(--g3);direction:ltr}
.done p{color:var(--g3);font-size:14px;max-width:320px}
.done .btn{width:100%}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);opacity:0;pointer-events:none;background:var(--fg);color:#000;padding:12px 24px;border-radius:99px;font-weight:700;font-size:14px;transition:.3s var(--ease);z-index:100}
.toast.show{transform:translateX(-50%);opacity:1}

/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.marq .track{animation:none}}
</style>
</head>
<body>

<div class="top-brand"><img src="flexin-logo.png" alt="FLEXIN"></div>
<div class="ann" data-i="ann"></div>

<header>
  <div class="wrap bar">
    <a href="#top" class="logo"><img src="flexin-logo.png" alt="FLEXIN"></a>
    <nav>
      <a href="#products" class="lk" data-i="nav_products"></a>
      <a href="#about" class="lk" data-i="nav_about"></a>
      <div class="tools">
        <button class="lang" id="lang">EN</button>
        <button class="cartbtn" id="openCart"><span data-i="cart"></span><b id="count">0</b></button>
      </div>
    </nav>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="spot"></div>
    <div class="wrap grid2">
      <div>
        <div class="eyebrow" data-i="eyebrow"></div>
        <h1 class="disp"><span data-i="h1a"></span><span class="dim" data-i="h1b"></span></h1>
        <p class="lead" data-i="hero_p"></p>
        <div class="cta">
          <a class="btn" href="#products" data-i="shop"></a>
          <a class="btn ghost" href="#about" data-i="nav_about"></a>
        </div>
      </div>
      <div class="visual">
        <img class="a" src="bat.png" alt="Bat T-shirt">
        <img class="b" src="spider.png" alt="Spider T-shirt">
      </div>
    </div>
  </div>

  <div class="marq" aria-hidden="true"><div class="track" id="track"></div></div>

  <section id="products">
    <div class="wrap">
      <div class="head rv">
        <h2 class="disp" data-i="products"></h2>
        <div class="sub" data-i="products_sub"></div>
      </div>
      <div class="grid rv" id="grid"></div>
    </div>
  </section>

  <div class="wrap rv">
    <div class="feat">
      <div><svg viewBox="0 0 24 24"><path d="M12 3s6 6.2 6 10.5A6 6 0 0 1 6 13.5C6 9.2 12 3 12 3z"/></svg><p><b data-i="f1t"></b><span data-i="f1d"></span></p></div>
      <div><svg viewBox="0 0 24 24"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg><p><b data-i="f2t"></b><span data-i="f2d"></span></p></div>
      <div><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg><p><b data-i="f3t"></b><span data-i="f3d"></span></p></div>
    </div>
  </div>

  <section class="about" id="about">
    <div class="ghost"><img src="flexin-logo.png" alt=""></div>
    <div class="wrap two">
      <div class="rv">
        <div class="eyebrow" data-i="about"></div>
        <div class="quote disp"><span data-i="about_q1"></span> <em data-i="about_q2"></em></div>
        <p data-i="about_1"></p>
        <p data-i="about_2"></p>
        <p data-i="about_3"></p>
        <div class="sig" data-i="sig"></div>
      </div>
      <div class="sg rv">
        <h3 class="disp" data-i="sizes_t"></h3>
        <table>
          <tr><th data-i="th_size"></th><th data-i="th_chest"></th><th data-i="th_weight"></th></tr>
          <tr><td>S</td><td>88–94</td><td>55–65</td></tr>
          <tr><td>M</td><td>94–100</td><td>65–75</td></tr>
          <tr><td>L</td><td>100–106</td><td>75–85</td></tr>
          <tr><td>XL</td><td>106–112</td><td>85–95</td></tr>
        </table>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="fgrid">
      <div class="logo"><img src="flexin-logo.png" alt="FLEXIN"><p data-i="foot"></p></div>
      <div class="links">
        <a href="#products" data-i="nav_products"></a>
        <a href="#about" data-i="nav_about"></a>
        <a id="waLink" href="#" target="_blank" rel="noopener">WhatsApp</a>
        <a id="igLink" href="#" target="_blank" rel="noopener" hidden>Instagram</a>
      </div>
    </div>
    <div class="copy"><span>© <span id="yr"></span> FLEXIN</span><span>BUILT TO BE SEEN</span></div>
  </div>
</footer>

<a class="wa" id="waFloat" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.200zm4.500-6.100c-.2-.1-1.500-.7-1.700-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.700 6.700 0 0 1-3.300-2.900c-.2-.4.2-.4.700-1.300a.5.5 0 0 0 0-.4l-.8-1.800c-.2-.4-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.200 5.300 5.300 0 0 0 1.100 2.800 12 12 0 0 0 4.600 4c1.700.7 1.700.5 2 .5a1.700 1.700 0 0 0 1.200-.8 1.400 1.400 0 0 0 .1-.8c0-.1-.2-.2-.5-.3z"/></svg>
</a>

<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer" aria-label="cart">
  <div class="dh"><span data-i="your_cart"></span><button id="closeCart" aria-label="close">×</button></div>
  <div class="items" id="items"></div>
  <div class="done" id="done" hidden>
    <div class="ok">✓</div>
    <h3 data-i="done_t"></h3>
    <div class="oid" id="doneId"></div>
    <p data-i="done_p"></p>
    <a class="btn" id="doneWa" href="#" target="_blank" rel="noopener" data-i="done_wa"></a>
    <button class="btn ghost" id="doneClose" data-i="done_close"></button>
  </div>
  <div class="df" id="df">
    <div class="row"><span data-i="subtotal"></span><span id="sub"></span></div>
    <div class="row"><span data-i="shipping"></span><span data-i="ship_note"></span></div>
    <div class="row t"><span data-i="total"></span><span id="total"></span></div>
    <input id="name" data-p="ph_name" autocomplete="name">
    <input id="phone" data-p="ph_phone" inputmode="tel" autocomplete="tel" maxlength="14">
    <input id="hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <select id="gov"></select>
    <textarea id="addr" data-p="ph_addr"></textarea>
    <button class="btn" id="send" data-i="confirm"></button>
    <div class="note" data-i="cod_note"></div>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script>
/* ============ عدّل البيانات هنا بس / Edit here only ============ */

};
const GOVS = {
  ar:["القاهرة","الجيزة","الإسكندرية","القليوبية","الشرقية","الدقهلية","الغربية","المنوفية","البحيرة","كفر الشيخ","دمياط","بورسعيد","الإسماعيلية","السويس","شمال سيناء","جنوب سيناء","الفيوم","بني سويف","المنيا","أسيوط","سوهاج","قنا","الأقصر","أسوان","البحر الأحمر","الوادي الجديد","مطروح"],
  en:["Cairo","Giza","Alexandria","Qalyubia","Sharqia","Dakahlia","Gharbia","Monufia","Beheira","Kafr El Sheikh","Damietta","Port Said","Ismailia","Suez","North Sinai","South Sinai","Fayoum","Beni Suef","Minya","Assiut","Sohag","Qena","Luxor","Aswan","Red Sea","New Valley","Matrouh"]
};
/* ================================================================ */

const T = {
ar:{
  ann:"الدفع عند الاستلام · الشحن لكل المحافظات",
  nav_products:"المنتجات", nav_about:"من نحن", cart:"السلة",
  eyebrow:"كوليكشن 01",
  h1a:"مصنوع", h1b:"عشان يتشاف.",
  hero_p:"تيشرتات جيم كومبريشن بتثبت على جسمك وبتتنفس معاك. من اللحظة اللي بتدخل فيها، الكل عارف إنك وصلت.",
  shop:"تسوّق دلوقتي",
  products:"الكوليكشن", products_sub:"",
  f1t:"خامة سريعة الجفاف", f1d:"للتمرين الطويل من غير ما تحس بيها",
  f2t:"قصة كومبريشن", f2d:"بتبرز العضلات وبتثبت مكانها",
  f3t:"الدفع عند الاستلام", f3d:"اطلب وادفع لما توصلك",
  size:"المقاس", add:"أضف للسلة",
  about:"من نحن",
  about_q1:"إحنا مش بنحاول نثبت حاجة.", about_q2:"إحنا واثقين.",
  about_1:"FLEXIN اتولد من فكرة واحدة: اللي بيتمرن بجد مش محتاج يشرح نفسه. بيدخل الجيم وهو عارف قيمة اللي بيعمله، وعارف إن شكله بيتكلم قبله.",
  about_2:"عشان كده كل تيشرت عندنا بنختاره بعين صعبة الإرضاء. خامة بتستحمل أقسى تمرينة، قصة بتتحط على جسمك زي ما هو محتاجها، وتفاصيل بتتشاف من غير ما تلفت نظر لنفسها. ومش بنطرح حاجة إلا لما نكون متأكدين إنها تستاهل اسمنا.",
  about_3:"اللي بيلبس FLEXIN مش بيدوّر على انتباه، هو بيجيله لوحده.",
  sig:"FLEXIN — مصنوع عشان يتشاف",
  sizes_t:"جدول المقاسات", th_size:"المقاس", th_chest:"الصدر (سم)", th_weight:"الوزن التقريبي (كجم)",
  foot:"تيشرتات جيم كومبريشن للي واثق من نفسه.",
  your_cart:"سلتك", subtotal:"المجموع", shipping:"الشحن", ship_note:"بيتحدد عند الطلب حسب المحافظة", total:"إجمالي المنتجات",
  ph_name:"الاسم", ph_phone:"رقم الموبايل", ph_addr:"العنوان بالتفصيل", gov0:"اختار المحافظة",
  confirm:"أكّد الطلب على واتساب", cod_note:"الدفع عند الاستلام. هتتحول لواتساب عشان تبعت الطلب وهنأكد معاك سعر الشحن.",
  empty:"السلة فاضية", size_word:"مقاس", pick_size:"اختار المقاس الأول", added:"اتضاف للسلة ✓", fill:"كمّل بياناتك الأول", cur:"ج.م", off:"خصم",
  done_t:"وصلنا طلبك!", done_p:"بعتنا طلبك لينا. كمّل الإرسال من واتساب عشان نأكد معاك الشحن والموعد. لو واتساب ما فتحش، دوس على الزرار.", done_wa:"افتح واتساب", done_close:"تمام", bad_phone:"رقم الموبايل غلط (مثال: 01012345678)", m_new:"طلب جديد من FLEXIN", m_qty:"عدد", m_sub:"مجموع المنتجات", m_ship:"الشحن: هيتحدد حسب المحافظة", m_name:"الاسم", m_phone:"الموبايل", m_gov:"المحافظة", m_addr:"العنوان", m_pay:"الدفع: عند الاستلام", langBtn:"EN"
},
en:{
  ann:"Cash on delivery · Shipping nationwide",
  nav_products:"Shop", nav_about:"About", cart:"Cart",
  eyebrow:"Drop 01",
  h1a:"Built to", h1b:"be seen.",
  hero_p:"Compression gym tees that lock onto your frame and breathe with you. The moment you walk in, everyone knows you've arrived.",
  shop:"Shop now",
  products:"The Drop", products_sub:"",
  f1t:"Quick-dry fabric", f1d:"Made for long sessions, felt by no one",
  f2t:"Compression fit", f2d:"Sharpens your build and stays put",
  f3t:"Cash on delivery", f3d:"Order now, pay when it arrives",
  size:"Size", add:"Add to cart",
  about:"About us",
  about_q1:"We're not trying to prove anything.", about_q2:"We're confident.",
  about_1:"FLEXIN was born from one idea: someone who trains hard doesn't need to explain themselves. They walk into the gym knowing what they're worth, and that how they look speaks first.",
  about_2:"That's why every tee we make is picked with a hard-to-please eye. Fabric that survives your toughest session, a cut that sits on your body exactly the way it should, and details you notice without them begging for attention. We release nothing unless we're sure it deserves the name.",
  about_3:"Whoever wears FLEXIN isn't chasing attention. It comes to them.",
  sig:"FLEXIN — Built to be seen",
  sizes_t:"Size guide", th_size:"Size", th_chest:"Chest (cm)", th_weight:"Approx. weight (kg)",
  foot:"Compression gym tees for the ones who know their worth.",
  your_cart:"Your cart", subtotal:"Subtotal", shipping:"Shipping", ship_note:"Set on order, by governorate", total:"Products total",
  ph_name:"Full name", ph_phone:"Mobile number", ph_addr:"Full address", gov0:"Select governorate",
  confirm:"Confirm order on WhatsApp", cod_note:"Cash on delivery. You'll be taken to WhatsApp to send the order, and we'll confirm shipping with you.",
  empty:"Your cart is empty", size_word:"Size", pick_size:"Pick a size first", added:"Added to cart ✓", fill:"Please fill in your details", cur:"EGP", off:"OFF",
  done_t:"Order received!", done_p:"We got your order. Finish sending it on WhatsApp so we can confirm shipping and delivery. If WhatsApp did not open, tap the button.", done_wa:"Open WhatsApp", done_close:"Done", bad_phone:"Invalid mobile number (e.g. 01012345678)", m_new:"New FLEXIN order", m_qty:"Qty", m_sub:"Products total", m_ship:"Shipping: to be set by governorate", m_name:"Name", m_phone:"Phone", m_gov:"Governorate", m_addr:"Address", m_pay:"Payment: cash on delivery", langBtn:"عربي"
}};

const $ = s => document.querySelector(s);
let lang = localStorage.getItem("flexin_lang") || "ar";
let cart = JSON.parse(localStorage.getItem("flexin_cart") || "[]");
const picked = {};
const t = k => T[lang][k];
const fmt = n => n.toLocaleString(lang === "ar" ? "ar-EG" : "en-US") + " " + t("cur");
const prod = id => CONFIG.products.find(p => p.id === id);
const subtotal = () => cart.reduce((a,c) => a + (prod(c.id) ? prod(c.id).price * c.qty : 0), 0);
cart = cart.filter(c => prod(c.id));

$("#yr").textContent = new Date().getFullYear();
const wa = "https://wa.me/" + CONFIG.whatsapp;
$("#waLink").href = wa; $("#waFloat").href = wa;
if (CONFIG.instagram) { $("#igLink").href = CONFIG.instagram; $("#igLink").hidden = false; }

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll("[data-p]").forEach(el => el.placeholder = t(el.dataset.p));
  $("#lang").textContent = t("langBtn");
  const g = $("#gov"), cur = g.selectedIndex;
  g.innerHTML = `<option value="">${t("gov0")}</option>` + GOVS[lang].map(x => `<option>${x}</option>`).join("");
  g.selectedIndex = cur > 0 ? cur : 0;
  renderProducts(); render();
}

function marquee(){
  const words = ["FLEXIN","BUILT TO BE SEEN","DROP 01","COMPRESSION FIT","QUICK-DRY","NO COMPROMISE"];
  const one = words.map(w => `<span>${w}</span><span class="d">/</span>`).join("");
  $("#track").innerHTML = one.repeat(4);
}

function renderProducts(){
  $("#grid").innerHTML = CONFIG.products.map((p,i) => {
    const pct = p.oldPrice ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
    return `
    <article class="card">
      <div class="pic">
        ${pct ? `<div class="badge"><bdi dir="ltr">-${pct}%</bdi></div>` : ""}
        <div class="num">0${i+1}</div>
        <img src="${p.img}" alt="${p.name}" loading="lazy">
      </div>
      <div class="body">
        <h3 class="disp">${p.name}</h3>
        <div class="price">${fmt(p.price)}${p.oldPrice ? `<s class="old">${fmt(p.oldPrice)}</s>` : ""}</div>
        <p class="desc">${p.desc[lang]}</p>
        <div class="lbl">${t("size")}</div>
        <div class="sizes" data-id="${p.id}">${CONFIG.sizes.map(s => `<button type="button" data-s="${s}" class="${picked[p.id]===s?"on":""}">${s}</button>`).join("")}</div>
        <button class="btn" data-add="${p.id}">${t("add")}</button>
      </div>
    </article>`;
  }).join("");
}

document.addEventListener("click", e => {
  const sz = e.target.closest(".sizes button");
  if (sz) {
    const box = sz.parentElement;
    box.querySelectorAll("button").forEach(b => b.classList.remove("on"));
    sz.classList.add("on");
    picked[box.dataset.id] = sz.dataset.s;
  }
  const add = e.target.closest("[data-add]");
  if (add) {
    const id = add.dataset.add, size = picked[id];
    if (!size) return toast(t("pick_size"));
    const f = cart.find(c => c.id === id && c.size === size);
    f ? f.qty++ : cart.push({ id, size, qty: 1 });
    save(); toast(t("added"));
  }
});

function save(){ localStorage.setItem("flexin_cart", JSON.stringify(cart)); render(); }

function render(){
  $("#count").textContent = cart.reduce((a,c) => a + c.qty, 0);
  $("#items").innerHTML = cart.length ? cart.map((c,i) => {
    const p = prod(c.id);
    return `<div class="it">
      <img src="${p.img}" alt="">
      <div class="meta"><b>${p.name}</b><span>${t("size_word")} ${c.size} · ${fmt(p.price)}</span></div>
      <div class="qty"><button data-q="${i}" data-d="-1">−</button><span>${c.qty}</span><button data-q="${i}" data-d="1">+</button></div>
    </div>`;
  }).join("") : `<div class="empty">${t("empty")}</div>`;
  if (cart.length) { $("#done").hidden = true; $("#items").hidden = false; }
  $("#df").style.display = cart.length ? "flex" : "none";
  $("#sub").textContent = fmt(subtotal());
  $("#total").textContent = fmt(subtotal());
}

$("#items").addEventListener("click", e => {
  const b = e.target.closest("[data-q]"); if (!b) return;
  const i = +b.dataset.q; cart[i].qty += +b.dataset.d;
  if (cart[i].qty <= 0) cart.splice(i,1);
  save();
});

const openCart = v => { $("#drawer").classList.toggle("show", v); $("#ov").classList.toggle("show", v); };
$("#openCart").onclick = () => openCart(true);
$("#closeCart").onclick = $("#ov").onclick = () => openCart(false);
$("#lang").onclick = () => { lang = lang === "ar" ? "en" : "ar"; localStorage.setItem("flexin_lang", lang); applyLang(); };

$("#send").onclick = () => {
  if (!cart.length) return;
  const name = $("#name").value.trim(), gov = $("#gov").value, addr = $("#addr").value.trim();
  const phone = $("#phone").value.replace(/[\s-]/g,"").replace(/^\+?20/,"0");
  if (!name || !phone || !gov || !addr) return toast(t("fill"));
  if (!/^01[0-9]{9}$/.test(phone)) return toast(t("bad_phone"));
  if ($("#hp").value) return; // bots only
  const id = "FX" + Date.now().toString(36).toUpperCase().slice(-5);
  const lines = cart.map(c => `• ${prod(c.id).name} | ${t("size_word")} ${c.size} | ${t("m_qty")} ${c.qty} | ${prod(c.id).price * c.qty} ${t("cur")}`).join("\n");
  const msg = `${t("m_new")} #${id}\n\n${lines}\n\n${t("m_sub")}: ${subtotal()} ${t("cur")}\n${t("m_ship")}\n\n${t("m_name")}: ${name}\n${t("m_phone")}: ${phone}\n${t("m_gov")}: ${gov}\n${t("m_addr")}: ${addr}\n${t("m_pay")}`;
  const link = wa + "?text=" + encodeURIComponent(msg);
  // 1) automatic copy of the order to the owner's phone (Telegram, through /api/order)
  try {
    fetch("/api/order", { method: "POST", headers: { "content-type": "application/json" }, keepalive: true,
      body: JSON.stringify({ id, name, phone, gov, addr, items: cart.map(c => ({ id: c.id, size: c.size, qty: c.qty })) }) }).catch(() => {});
  } catch (e) {}
  // 2) open WhatsApp with the same order
  window.open(link, "_blank");
  try { localStorage.setItem("flexin_cust", JSON.stringify({ name, phone, gov: $("#gov").selectedIndex, addr })); } catch (e) {}
  $("#doneId").textContent = "#" + id;
  $("#doneWa").href = link;
  cart = []; save();
  $("#items").hidden = true; $("#done").hidden = false;
};
$("#doneClose").onclick = () => openCart(false);

function toast(m){ const el = $("#toast"); el.textContent = m; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1800); }

const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: .12 }) : null;
document.querySelectorAll(".rv").forEach(el => io ? io.observe(el) : el.classList.add("in"));

marquee();
applyLang();
try {
  const sv = JSON.parse(localStorage.getItem("flexin_cust") || "{}");
  if (sv.name) $("#name").value = sv.name;
  if (sv.phone) $("#phone").value = sv.phone;
  if (sv.addr) $("#addr").value = sv.addr;
  if (sv.gov > 0) $("#gov").selectedIndex = sv.gov;
} catch (e) {}
</script>
</body>
